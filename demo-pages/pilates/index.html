<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨 필라테스 | 망원동 그룹 필라테스</title>
<style>
  body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;background:#f3f6f2;color:#263027}
  header{padding:30px 20px 12px;text-align:center}
  header h1{margin:0;font-size:28px;font-weight:700}
  main{max-width:440px;margin:0 auto;padding:0 20px 30px;line-height:1.6}
  .badge{display:inline-block;background:#2f6b4f;color:#fff;border-radius:20px;padding:4px 12px;font-size:13px}
  form{background:#fff;border-radius:12px;padding:18px;margin-top:16px}
  label{display:block;font-size:13px;margin:10px 0 4px}
  input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d4ddd4;border-radius:8px;font-size:15px}
  button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:8px;background:#2f6b4f;color:#fff;font-size:15px}
</style>
</head>
<body>
<header><h1>숨 필라테스</h1><p>망원동 그룹 필라테스</p></header>
<main>
  <span class="badge">11월 오픈</span>
  <p>숨 필라테스가 11월 망원동에 새로 문을 열었습니다. 오픈 기념으로 첫 체험 수업을 1만원에 진행합니다(정가 3만5천원). 체험 수업은 선착순 20명만 받습니다.</p>
  <p>이름과 연락처, 희망 시간대를 남겨 주시면 확인 후 카카오톡으로 연락드립니다. 망원역 2번 출구 도보 3분.</p>
  <form action="https://soomstudio.kr/apply" method="post" onsubmit="return false">
    <label for="n">이름</label><input id="n" name="name">
    <label for="p">연락처</label><input id="p" name="phone" type="tel">
    <label for="t">희망 시간대</label><input id="t" name="time">
    <button type="submit">체험 수업 신청</button>
  </form>
</main>
</body>
</html>
